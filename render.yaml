services:
  - type: web
    name: motosaic-portal
    runtime: node
    plan: starter
    # npm install first so node_modules exists, then drop Python deps inside
    # it (Render's buildpack guarantees node_modules persists into runtime —
    # arbitrary top-level dirs like ./python-deps did not). Then build.
    buildCommand: npm install && pip3 install --target=./node_modules/.python-deps -r server/deck-generator/requirements.txt && npm run build
    startCommand: npm start
    disk:
      name: motosaic-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: DB_PATH
        value: /data/motosaic.db
      - key: SESSION_SECRET
        generateValue: true
      # Set this in the Render dashboard before first deploy — the /admin route
      # returns 500 on login until ADMIN_PASSWORD is configured. Pick something strong.
      - key: ADMIN_PASSWORD
        sync: false
      # ─── Zoom transcript ingestion ─────────────────────────────────────────
      # Set ZOOM_WEBHOOK_SECRET_TOKEN before flipping ZOOM_TRANSCRIPT_INGEST_ENABLED
      # to "true". Without the token, all webhook signature checks fail.
      # ZOOM_ACCOUNT_ID, ZOOM_CLIENT_ID, ZOOM_CLIENT_SECRET aren't used in v1
      # (download_token in the webhook payload authorizes the transcript fetch);
      # they're reserved for the planned phase-2 backfill / list-recordings work.
      - key: ZOOM_WEBHOOK_SECRET_TOKEN
        sync: false
      - key: ZOOM_TRANSCRIPT_INGEST_ENABLED
        value: "false"
      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
