services:
  - type: web
    name: motosaic-portal
    runtime: node
    plan: starter
    buildCommand: pip3 install --user -r server/deck-generator/requirements.txt && npm install && npm run build
    startCommand: npm start
    disk:
      name: motosaic-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: DB_PATH
        value: /data/motosaic.db
      - key: SESSION_SECRET
        generateValue: true
      # Set this in the Render dashboard before first deploy — the /admin route
      # returns 500 on login until ADMIN_PASSWORD is configured. Pick something strong.
      - key: ADMIN_PASSWORD
        sync: false
