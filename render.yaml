services:
  - type: web
    name: motosaic-portal
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: motosaic-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: DB_PATH
        value: /data/motosaic.db
      - key: SESSION_SECRET
        generateValue: true
